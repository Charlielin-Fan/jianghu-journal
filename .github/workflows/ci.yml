name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Run Go tests
        run: go test ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Build Windows application
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o "$env:RUNNER_TEMP\江湖行记.exe" .
